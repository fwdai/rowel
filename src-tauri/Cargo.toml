[package]
name = "rowel"
version = "1.0.0-alpha.7"
description = "Modern, Lightweight, Fast and Free Password Manager"
authors = ["Alex Chaplinsky"]
edition = "2021"
# Floor set by the locked dependency graph: glib/gio-sys 0.22 (pulled in by the
# tauri plugins on Linux) declare 1.92, above the RustCrypto 0.11 crates (1.85)
# and passkey-rs 0.5 (1.85.1). The toolchain itself is pinned in
# rust-toolchain.toml.
rust-version = "1.92"
# Desktop application, never published to crates.io.
publish = false
# `crates/autofill` is a default member with its own `uniffi-bindgen` binary,
# so a bare `cargo run` (which is what `tauri dev` issues) needs telling which
# one is the app.
default-run = "rowel"

# The app, the Tauri-free vault core it is built on (`crates/core`), and the
# library the iOS AutoFill extension links in its place (`crates/autofill`).
# All are default members, so a bare `cargo test` or `cargo clippy` from here
# covers every one.
[workspace]
members = ["crates/core", "crates/autofill"]
default-members = [".", "crates/core", "crates/autofill"]

[lib]
name = "rowel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rowel-core = { path = "crates/core" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ring = "0.17"
sha2 = "0.11"
subtle = "2"
rand = "0.8"
hex = "0.4"
base64 = "0.23"
# 6.0 turns what used to be unconditional into features. `alloc` is the one we
# need — it is what gates base32 secrets. Deliberately *not* `std`: all it adds
# over `alloc` is the `*_current` helpers that read the clock themselves, and it
# names `rand?/thread_rng`, which is enough to drag `rand` 0.10 into Cargo.lock
# beside the 0.8 this crate uses. `commands::generator` passes the timestamp in
# instead, which it already had to compute for the window countdown.
totp-rs = { version = "6", default-features = false, features = ["alloc"] }
zxcvbn = "3"
log = "0.4.34"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "query", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12"] }
url = "2"
# Only for `StreamExt::buffer_unordered`, which is what gives the HIBP breach
# check its bounded fan-out (`hibp::check_all`). Already in the locked graph
# under reqwest, and `std` is the single feature `buffer_unordered` needs — the
# async-await macros the default set adds are not used here.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# `serde` so a master password can be deserialized straight into a
# `Zeroizing<String>` at the command boundary and scrubbed when it drops.
zeroize = { version = "1.8.2", features = ["serde"] }
tempfile = "3"
sys-locale = "0.3"
# WebAuthn authenticator core (1Password's passkey-rs, MIT OR Apache-2.0). Kept
# in lockstep across passkey-types/-authenticator/-client: the traits pass the
# crates' own types, so a mixed set does not compile.
passkey-types = "0.5"
passkey-authenticator = "0.5"
# P-256 keys (PKCS#8 <-> COSE) and the COSE key type passkey-types speaks.
# Both pinned to what passkey-authenticator itself depends on, so exactly one
# copy of each is linked.
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
coset = "0.4"
# OpenSSH key format (RustCrypto). ed25519 only for now: `rand_core` gives the
# keygen, `std` the I/O impls the OpenSSH encoding needs.
ssh-key = { version = "0.6.7", default-features = false, features = [
  "ed25519",
  "rand_core",
  "std",
] }

# Only for `O_NONBLOCK`, the flag that keeps opening a user-chosen path from
# parking on a FIFO with no writer (`storage::read_regular_file_capped`). Every
# Unix target already links it — it is in the locked graph under tauri, ring and
# most of the rest — so this names what is there rather than adding to it.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Desktop-only, minus Windows. The in-app WebDriver server for the E2E smoke
# suite (debug builds only, see `lib.rs`). tauri-plugin-webdriver 0.2.3 still
# pins webview2-com 0.38 / windows 0.61 while wry 0.57 (tauri 2.12) moved to
# webview2-com 0.39 / windows 0.62, so on Windows the ICoreWebView2 handle wry
# hands the plugin is a different type from the one its bindings expect and the
# crate fails to compile. CI only runs the E2E suite on Linux. Re-enable on
# Windows once upstream releases against windows 0.62:
# https://github.com/Choochmeque/tauri-plugin-webdriver
[target.'cfg(not(any(target_os = "android", target_os = "ios", target_os = "windows")))'.dependencies]
tauri-plugin-webdriver = "0.2"

# Desktop-only (the `desktop` cfg alias tauri-build defines is this same
# predicate). None of these support a mobile target.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Only the legacy-Electron vault migration needs it, and that only ever ran on
# desktop (see `storage::ensure_migrated`).
dirs = "7"
# The browser extension host (`browser`). `crypto_box` is NaCl's box — X25519
# plus XSalsa20-Poly1305 — which is what the KeePassXC-Browser protocol seals
# every message with (the extension uses tweetnacl); `interprocess` is the one
# API over the Unix socket and the Windows named pipe the extension's proxy
# process reaches the app through.
crypto_box = "0.9"
interprocess = "2"

# Passkeys through the extension (`browser::passkeys`), where the host is the
# WebAuthn client: tokio's current-thread runtime drives the authenticator's
# async traits on the connection's own thread. Already in the locked graph.
tokio = { version = "1", features = ["rt"] }

# Frameworks that exist on both macOS and iOS: Foundation, LocalAuthentication,
# Vision and the Keychain.
[target.'cfg(target_vendor = "apple")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
# `LABiometryType` gates the `LAContext.biometryType` property — which biometry
# this device actually has, so Touch ID iPads are not labelled Face ID.
# `LAError` is the reply's error code, which is how a prompt the user dismissed
# is told apart from one that failed.
objc2-local-authentication = { version = "0.3", features = [
  "LAContext",
  "LABiometryType",
  "LAError",
  "block2",
] }
block2 = "0.6"
# On-device text recognition (VNRecognizeTextRequest) for the image scanner.
# Only the headers the scanner touches are enabled; `objc2-core-foundation`
# gates the observation's bounding box, which is what puts lines in reading
# order.
objc2-vision = { version = "0.3.2", default-features = false, features = [
  "std",
  "VNRequest",
  "VNRequestHandler",
  "VNRecognizeTextRequest",
  "VNObservation",
  "VNTypes",
  "objc2-core-foundation",
] }
# Biometric-gated Keychain (SecAccessControl / kSecAccessControlBiometryCurrentSet).
# OSX_10_15 enables the data-protection keychain required for biometric ACLs on
# macOS; on iOS every keychain item already lives there, so the feature is inert.
security-framework = { version = "3.6.0", features = ["OSX_10_15"] }

# Mobile-only. The OAuth redirect for a public (iOS/Android) client comes back
# on the app's own URL scheme, which is what this registers and listens for;
# desktop keeps its loopback listener and never links this in.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-deep-link = "2"

[target.'cfg(target_os = "macos")'.dependencies]
# NSWindow, NSAnimationContext and its block-based completion: the zoom the
# webview can follow (see `zoom`).
objc2-app-kit = { version = "0.3", features = [
  "NSPasteboard",
  "NSWindow",
  "NSAnimationContext",
  "NSEvent",
  "block2",
] }

[target.'cfg(target_os = "ios")'.dependencies]
# UIPasteboard: the iOS clipboard write, with the local-only + expiry options
# that keep a secret off Universal Clipboard (see `commands/clipboard.rs`).
objc2-ui-kit = { version = "0.3", default-features = false, features = [
  "std",
  "UIPasteboard",
] }
# ASCredentialIdentityStore: the logins and passkeys QuickType suggests for the
# AutoFill extension (see `credential_identities`). Only the store, its state
# and the two identity kinds; `block2` gates the completion handlers.
objc2-authentication-services = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "ASCredentialIdentity",
  "ASCredentialIdentityStore",
  "ASCredentialIdentityStoreState",
  "ASCredentialServiceIdentifier",
  "ASPasswordCredentialIdentity",
  "ASPasskeyCredentialIdentity",
] }

[target.'cfg(target_os = "windows")'.dependencies]
# `Media_Ocr` + the imaging/storage stack it needs are for the image scanner:
# a file path -> SoftwareBitmap -> recognized lines.
# `Security_Credentials` is the Hello *key credential* (KeyCredentialManager)
# the stored vault key is wrapped under; `Security_Credentials_UI` is the
# consent prompt for in-session re-unlock; `Security_Cryptography_Core` checks
# the enrollment signature is the deterministic PKCS#1 v1.5 the wrap relies on.
# `Win32_Security*` + `Win32_System_Threading` build the owner-only DACL for
# plaintext exports, and `Win32_Storage_FileSystem` is the `CreateFileW` that
# takes it at creation (`crates/core/src/owner_only.rs`).
windows = { version = "0.62", features = ["Security_Credentials", "Security_Credentials_UI", "Security_Cryptography_Core", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Threading", "Media_Ocr", "Graphics_Imaging", "Storage", "Storage_Streams"] }
# Credential Manager storage. It holds only the Hello-wrapped blob — Credential
# Manager itself has no biometric gate (see `secure_store::GateMode::HelloKey`).
keyring = { version = "3", features = ["windows-native"] }
# Where a browser looks for a native messaging host on Windows is a registry
# key, not a file (`browser::manifest`).
windows-registry = "0.5"

[dev-dependencies]
# The core's test seams (`MemoryVault`, `set_user_version`) for the app's tests.
rowel-core = { path = "crates/core", features = ["test-support"] }
# The CredentialStore/UserValidationMethod traits are async, so the tests need
# a runtime; `rt` (current-thread) + `macros` is the whole of it.
tokio = { version = "1", features = ["rt", "macros"] }

[patch.crates-io]
# Xcode 27's SwiftPM prelinks each Swift module into one object and demotes the
# SwiftRs runtime `@_cdecl` exports (retain_object, release_object,
# string_from_bytes) to local symbols, so the iOS cdylib fails to link with
# "Undefined symbols for architecture arm64". swift-rs 1.0.8 only re-globalizes
# each package's own member, never SwiftRs.o where these live.
#
# This is 1.0.8 + upstream PR Brendonovich/swift-rs#80: the symbols are made
# global in the ONE archive named by SWIFT_RS_RUNTIME_ARCHIVE (set to `Tauri` in
# the repo-root .cargo/config.toml). Drop this pin once a swift-rs release
# includes that PR.
swift-rs = { git = "https://github.com/alchaplinsky/swift-rs", rev = "aaf38d45ab3a4b10a5af3a3dbc64424e998fae8c" }
