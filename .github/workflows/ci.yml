name: CI

on:
  push:
    branches: [master, main, v1-0-0]
  pull_request:

# Cancel superseded PR runs (rapid pushes stack full matrices otherwise);
# push runs on the protected branches are never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # On PRs, each job below runs only when its inputs changed (a docs-only PR
  # runs nothing; a frontend-only PR skips the Rust matrix). Pushes to the
  # protected branches always run everything. A skipped job satisfies branch
  # protection, and if this detection job itself fails every job runs anyway
  # (see the `needs.changes.result != 'success'` clause on each job).
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      rust: ${{ steps.filter.outputs.rust }}
      ios: ${{ steps.filter.outputs.ios }}
      crypto: ${{ steps.filter.outputs.crypto }}
      e2e: ${{ steps.filter.outputs.e2e }}
      supply-chain: ${{ steps.filter.outputs.supply-chain }}
      extension: ${{ steps.filter.outputs.extension }}
      safari: ${{ steps.filter.outputs.safari }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            ci: &ci
              - '.github/workflows/ci.yml'
            frontend-src: &frontend-src
              - 'src/**'
              - 'index.html'
              - 'package.json'
              - 'bun.lock'
              - 'tsconfig.json'
              - 'tsconfig.node.json'
              - 'vite.config.ts'
              - 'eslint.config.js'
            rust-src: &rust-src
              - 'src-tauri/**'
              - 'rust-toolchain.toml'
            frontend:
              - *ci
              - *frontend-src
            rust:
              - *ci
              - *rust-src
            # The iOS gate covers the crate, the Xcode project and app metadata
            # (all under src-tauri/), and the iOS frontend bundle.
            ios:
              - *ci
              - *rust-src
              - *frontend-src
            crypto:
              - *ci
              - *rust-src
              - 'scripts/**'
            e2e:
              - *ci
              - *frontend-src
              - *rust-src
              - 'tests/e2e/**'
            supply-chain:
              - *ci
              - 'package.json'
              - 'bun.lock'
              - 'src-tauri/Cargo.toml'
              - 'src-tauri/Cargo.lock'
              - 'src-tauri/deny.toml'
              - 'scripts/check-tauri-versions.mjs'
            extension:
              - *ci
              - 'extension/**'
              - 'extension/upstream-map.json'
              - 'scripts/extension-sync.mjs'
              - 'scripts/extension-strings.mjs'
              - 'scripts/extension-theme.mjs'
              - 'src/styles/theme.css'
              - 'scripts/check-extension-build.mjs'
            safari:
              - *ci
              - 'src-tauri/gen/safari/**'

  frontend:
    name: Frontend (build + lint)
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      !cancelled() && (
        github.event_name != 'pull_request' ||
        needs.changes.result != 'success' ||
        needs.changes.outputs.frontend == 'true'
      )
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run build
      - run: bun run test

  rust:
    name: Rust (${{ matrix.os }})
    needs: changes
    if: >-
      !cancelled() && (
        github.event_name != 'pull_request' ||
        needs.changes.result != 'success' ||
        needs.changes.outputs.rust == 'true'
      )
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Install pinned Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Restore everywhere, save only on push. A PR run that also saved
          # wrote a second ~1 GB copy of every cache under refs/pull/N/merge;
          # with five cached jobs that doubled storage past the 10 GB repo
          # limit, GitHub evicted by LRU, and PRs then restored nothing at all
          # ("No cache found." -> ~14 min of cold compile, worst on Windows).
          # Push runs on the trunk keep one authoritative copy per job+OS that
          # every PR, from any branch, restores.
          save-if: ${{ github.event_name == 'push' }}

      # generate_context! only needs `../dist` to exist. Debug builds load the
      # frontend from `devUrl` and never embed it, so a stub replaces the full
      # `bun install` + `bun run build` here (that was ~2 min on Windows).
      - name: Stub frontend dist
        shell: bash
        run: mkdir -p dist && echo '<!doctype html>' > dist/index.html

      - name: Format check
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        working-directory: src-tauri
        run: cargo build --locked

  ios:
    # Everything about the iOS app that a hosted runner can check without an
    # Apple developer identity: the crate cross-compiles, the frontend bundles
    # under the iOS Vite target, and the committed Xcode project + app metadata
    # still parse. A full `tauri ios build` is deliberately not here — archiving
    # needs a signing certificate and provisioning profile that only exist as
    # release secrets, so it belongs with the release workflow, not on every PR.
    name: iOS (crate + app config)
    runs-on: macos-latest
    needs: changes
    if: >-
      !cancelled() && (
        github.event_name != 'pull_request' ||
        needs.changes.result != 'success' ||
        needs.changes.outputs.ios == 'true'
      )
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install

      - name: Add the iOS simulator target
        run: rustup target add aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # See the `rust` job: restore everywhere, save only on push.
          save-if: ${{ github.event_name == 'push' }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - run: bun install --frozen-lockfile

      # The real iOS bundle, not the stub the other Rust jobs use: this is the
      # only place `TAURI_ENV_PLATFORM=ios` is exercised, so it covers the
      # `__TAURI_PLATFORM__` define and the safari16 build target (a syntax the
      # WKWebView on iOS 16 can't parse fails here rather than on a device).
      - name: Build the frontend for iOS
        run: bun run build
        env:
          TAURI_ENV_PLATFORM: ios

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --target aarch64-apple-ios-sim --all-targets -- -D warnings

      # The AutoFill extension's Swift bindings are committed, and UniFFI checks
      # them against the library on load: a stale copy builds fine and then
      # aborts the extension at its first Rust call. A doc-comment edit
      # (114c3458) and a uniffi bump (#563) each shipped one.
      - name: AutoFill UniFFI bindings are current
        run: |
          set -euo pipefail
          sh src-tauri/crates/autofill/bindgen.sh
          # status, not diff: a deleted file comes back untracked, which diff misses.
          generated=src-tauri/gen/apple/Sources/autofill/generated
          if [ -n "$(git status --porcelain -- "$generated")" ]; then
            git status --short -- "$generated"
            git diff -- "$generated"
            echo '::error::Stale UniFFI bindings: run src-tauri/crates/autofill/bindgen.sh and commit what it writes'
            exit 1
          fi

      # Malformed XML in any of these only surfaces at build or upload time
      # otherwise, and a dropped privacy manifest is not an error at all — App
      # Store Connect just rejects the submission by email days later.
      - name: Validate the iOS app metadata
        run: |
          set -euo pipefail
          plutil -lint \
            src-tauri/Info.ios.plist \
            src-tauri/PrivacyInfo.xcprivacy \
            src-tauri/gen/apple/ExportOptions.plist \
            src-tauri/gen/apple/rowel_iOS/Info.plist \
            src-tauri/gen/apple/rowel_iOS/rowel_iOS.entitlements
          grep -q 'PrivacyInfo.xcprivacy' src-tauri/gen/apple/rowel.xcodeproj/project.pbxproj \
            || { echo '::error::PrivacyInfo.xcprivacy is not a resource of the iOS target'; exit 1; }

      # Parses the committed project.pbxproj and proves the scheme the release
      # build names still exists.
      - name: Validate the Xcode project
        run: xcodebuild -list -project src-tauri/gen/apple/rowel.xcodeproj

  safari:
    # The Safari extension's native relay (src-tauri/gen/safari): its XCTest
    # target runs the real HostConnection against a fake app on a Unix socket.
    # Ad-hoc signed; nothing here needs the web extension or a certificate.
    name: Safari extension (relay tests)
    runs-on: macos-latest
    needs: changes
    if: >-
      !cancelled() && (
        github.event_name != 'pull_request' ||
        needs.changes.result != 'success' ||
        needs.changes.outputs.safari == 'true'
      )
    steps:
      - uses: actions/checkout@v7
      - name: Test the relay
        run: >-
          xcodebuild test
          -project src-tauri/gen/safari/rowel_safari.xcodeproj
          -scheme rowel_safari_tests
          -destination 'platform=macOS'
          CODE_SIGN_IDENTITY=-

  supply-chain:
    name: Supply chain (audit + cargo-deny)
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      !cancelled() && (
        github.event_name != 'pull_request' ||
        needs.changes.result != 'success' ||
        needs.changes.outputs.supply-chain == 'true'
      )
    steps:
      - uses: actions/checkout@v7

      # JS dependency vulnerabilities. The blocking gate audits PRODUCTION
      # dependencies only — those are what ship in the app bundle (Tauri packages
      # the Rust binary + the built frontend; dev tooling like the wdio E2E stack
      # never enters the shipped artifact). A real advisory in a shipped dep still
      # hard-fails here.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - run: bun install --frozen-lockfile

      # `tauri build` refuses to compile when a Tauri npm package and its Rust
      # crate are on different major.minor releases. Dependabot bumps the two
      # sides in separate PRs (npm vs cargo), so catch the drift here rather
      # than in the release workflow.
      - name: Tauri npm/crate versions agree
        run: bun scripts/check-tauri-versions.mjs

      - name: bun audit (production deps — blocking)
        run: bun audit --audit-level=high --production

      # Dev-dependency advisories are surfaced but non-blocking: they matter for
      # local hygiene, but a transitive CVE in test tooling shouldn't gate a
      # release of code that never contains it. Review the log periodically.
      - name: bun audit (all deps — advisory only)
        continue-on-error: true
        run: bun audit --audit-level=high

      # Rust supply-chain gate: RustSec advisories + license policy + bans +
      # source allow-list. Config + documented exceptions live in
      # src-tauri/deny.toml (found next to the target manifest).
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: src-tauri/Cargo.toml
          arguments: ''
          command: check

  extension:
    # The browser extension is a KeePassXC-Browser subtree (see
    # docs/browser-extension.md) that keeps upstream's npm lockfile and
    # tooling, so this job runs npm inside extension/ rather than bun.
    name: Browser extension (lint + test + build)
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      !cancelled() && (
        github.event_name != 'pull_request' ||
        needs.changes.result != 'success' ||
        needs.changes.outputs.extension == 'true'
      )
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json

      # The source is upstream's tree under Rowel's paths (extension/
      # upstream-map.json). An upstream sync that left a file under an old
      # name, or a reference to one, without `bun run extension:sync` fails here.
      - name: Paths follow the upstream map
        working-directory: .
        run: node scripts/extension-sync.mjs --check

      # An upstream sync that brings new or changed strings without re-running
      # `bun run extension:strings` fails here instead of shipping "KeePassXC".
      - name: Strings are rebranded
        working-directory: .
        run: node scripts/extension-strings.mjs --check

      # css/rowel-tokens.css is generated from the app's design tokens; a change to
      # src/styles/theme.css without `bun run extension:theme` fails here.
      - name: Theme is generated
        working-directory: .
        run: node scripts/extension-theme.mjs --check

      - run: npm ci
      - run: npm run lint

      # The Safari native messaging port against a scripted runtime: order,
      # heartbeat, disconnects (plain node --test, no browser).
      - run: npm run test:safari

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox
      - run: npm run tests

      - run: npm run build
      # The Safari flavour (docs/safari-extension.md); after `build`, which
      # clears build/.
      - run: npm run build:safari

      - name: Check the built packages' IDs and host name
        working-directory: .
        run: node scripts/check-extension-build.mjs

  crypto-compat:
    name: Crypto compatibility
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      !cancelled() && (
        github.event_name != 'pull_request' ||
        needs.changes.result != 'success' ||
        needs.changes.outputs.crypto == 'true'
      )
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Install pinned Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Restore everywhere, save only on push. A PR run that also saved
          # wrote a second ~1 GB copy of every cache under refs/pull/N/merge;
          # with five cached jobs that doubled storage past the 10 GB repo
          # limit, GitHub evicted by LRU, and PRs then restored nothing at all
          # ("No cache found." -> ~14 min of cold compile, worst on Windows).
          # Push runs on the trunk keep one authoritative copy per job+OS that
          # every PR, from any branch, restores.
          save-if: ${{ github.event_name == 'push' }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      # The crosscheck script runs under bun; the Rust side only needs `../dist`
      # to exist (debug builds never embed it), so no frontend build.
      - run: bun install --frozen-lockfile
      - name: Stub frontend dist
        run: mkdir -p dist && echo '<!doctype html>' > dist/index.html

      # Rust decrypts the Node-generated golden fixtures and asserts plaintext.
      - name: Fixture + round-trip tests
        working-directory: src-tauri
        run: cargo test --locked

      # Rust encrypts -> Node decrypts, and vice versa.
      - name: Cross-implementation round-trip
        run: bun scripts/crypto-crosscheck.mjs

  e2e:
    # Specs run one at a time against a single app instance (the in-app
    # WebDriver server takes one session), so the suite is split across
    # parallel shards instead. tests/e2e/wdio.conf.ts reads E2E_SHARD and
    # picks every Nth spec file; add a shard here to split further.
    name: E2E smoke suite (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      !cancelled() && (
        github.event_name != 'pull_request' ||
        needs.changes.result != 'success' ||
        needs.changes.outputs.e2e == 'true'
      )
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xvfb \
            unzip

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Install pinned Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Restore everywhere, save only on push. A PR run that also saved
          # wrote a second ~1 GB copy of every cache under refs/pull/N/merge;
          # with five cached jobs that doubled storage past the 10 GB repo
          # limit, GitHub evicted by LRU, and PRs then restored nothing at all
          # ("No cache found." -> ~14 min of cold compile, worst on Windows).
          # Push runs on the trunk keep one authoritative copy per job+OS that
          # every PR, from any branch, restores.
          save-if: ${{ github.event_name == 'push' }}

      - run: bun install --frozen-lockfile

      # The debug binary serves the frontend from the Vite dev server that
      # wdio starts, so `../dist` only has to exist for generate_context!.
      - name: Stub frontend dist
        run: mkdir -p dist && echo '<!doctype html>' > dist/index.html

      - name: Build debug binary
        run: cargo build --manifest-path src-tauri/Cargo.toml

      - name: Run E2E tests
        run: xvfb-run --server-args="-screen 0 1280x800x24" bun run test:e2e
        env:
          E2E_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
          WEBKIT_DISABLE_COMPOSITING_MODE: 1
          NO_AT_BRIDGE: 1
