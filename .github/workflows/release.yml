# Builds, signs, notarizes and publishes Rowel for macOS, Windows and Linux as
# a DRAFT GitHub release, and uploads the `latest.json` update manifest that
# tauri-plugin-updater reads from `releases/latest/download/latest.json`.
# Publishing the draft is what makes a version visible to installed apps.
#
# Alongside the bundler's versioned installers, each job uploads a second copy
# of its own installers under a version-free name (`Rowel_universal.dmg` and
# friends), so `releases/latest/download/<name>` is a permanent download link.
# README.md and rowel.app point at those.
#
# Beside the installers the release carries the command line tool on its own
# (`rowel-<version>-<target>.tar.gz|.zip`, for a box without the app; see
# docs/serve.md), the Chromium and Firefox extension packages, and a
# SHA256SUMS over both. Safari's extension ships inside the macOS app.
#
# One-time secret setup and the per-release procedure: docs/releasing.md.
# The same build can be run locally with scripts/release-local.sh (macOS only).
#
# Repository secrets used. The Apple/Google names are the ones already set on
# the repo (from the Electron-era release workflows); the Tauri bundler expects
# different env names, so they are mapped below.
#   CERTIFICATES_P12 / CERTIFICATES_P12_PASSWORD        base64 .p12 export of the "Developer ID Application"
#                                                       cert + its export password (macOS signing). It must
#                                                       be that certificate: the bundler compares the .p12
#                                                       against APPLE_SIGNING_IDENTITY and aborts on a
#                                                       mismatch (an "Apple Development" cert here failed
#                                                       a previous run).
#   APPLE_ID / APPLE_ID_PASSWORD / APPLE_TEAM_ID        Apple ID, app-specific password, team id (notarization)
#   TAURI_SIGNING_PRIVATE_KEY(_PASSWORD)                minisign key for updater artifact signatures
#   GOOGLE_OAUTH_CLIENT_ID / GOOGLE_OAUTH_CLIENT_SECRET Desktop OAuth client, baked in at compile time
#                                                       (src-tauri/src/sync/auth.rs)
#   DROPBOX_APP_KEY                                     Dropbox app key (no secret), baked in at compile
#                                                       time (src-tauri/src/sync/providers/dropbox/oauth.rs)
#   GOOGLE_API_KEY                                      Drive API key for receiving shared secrets, baked
#                                                       in at compile time (src-tauri/src/share/remote.rs)
# Windows installers are not code-signed (no certificate). macOS is signed and notarized.
#
# Before the build starts, the Tauri CLI checks that every @tauri-apps/* npm
# package and its Rust crate share a major.minor; a mismatch fails all three
# platforms. CI's supply-chain job runs the same check on every PR
# (scripts/check-tauri-versions.mjs) so it is caught before release day.

name: Release

# Manual only — a release happens when someone clicks "Run workflow", never as
# a side effect of a merge or a pushed tag. The release tag/name comes from
# `version` in src-tauri/tauri.conf.json (keep package.json + Cargo.toml in
# sync). Note: GitHub only offers "Run workflow" for workflows present on the
# repo's default branch.
on:
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write # create/update the GitHub release + upload assets
      id-token: write # OIDC token for SLSA build-provenance attestation (T-CI-4)
      attestations: write # record the provenance attestation
    strategy:
      fail-fast: false
      matrix:
        # `latestAssets` is the version-free copies this job owns, as
        # `<glob of the built file>=<name to publish it under>` pairs. A glob
        # that matches nothing fails the job: a silently missing copy would
        # leave a dead link on README.md and rowel.app.
        # Every row carries `--config src-tauri/tauri.release.conf.json`: the
        # sidecar the "Build the command line tool" step stages is declared
        # there and nowhere else, so only a release build bundles it.
        include:
          - platform: macos-latest
            args: '--target universal-apple-darwin --config src-tauri/tauri.release.conf.json'
            bundlePath: src-tauri/target/universal-apple-darwin/release/bundle
            latestAssets: '*_universal.dmg=Rowel_universal.dmg'
          - platform: ubuntu-latest
            args: '--config src-tauri/tauri.release.conf.json'
            bundlePath: src-tauri/target/release/bundle
            latestAssets: '*_amd64.deb=Rowel_amd64.deb *_amd64.AppImage=Rowel_amd64.AppImage *.x86_64.rpm=Rowel_x86_64.rpm'
          # NSIS only. The MSI (WiX) bundler rejects a pre-release identifier
          # that is not purely numeric ("1.0.0-alpha.1" -> "optional pre-release
          # identifier in app version must be numeric-only"), and the updater
          # is happy with the NSIS -setup.exe. Drop the flag to ship an .msi as
          # well once versions are plain x.y.z.
          - platform: windows-latest
            args: '--bundles nsis --config src-tauri/tauri.release.conf.json'
            bundlePath: src-tauri/target/release/bundle
            latestAssets: '*_x64-setup.exe=Rowel_x64-setup.exe'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      # Same pinned toolchain as ci.yml and local dev (rust-toolchain.toml is
      # the single source of truth). The two Apple targets are release-only:
      # Tauri lipos them into one universal binary.
      - name: Install pinned Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install

      - name: Add Apple targets for the universal build
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      # Frontend toolchain is bun (matches ci.yml and the bun-based
      # beforeBuildCommand in tauri.conf.json; the repo ships bun.lock).
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.3

      - run: bun install --frozen-lockfile

      # Fail before the 20-minute build if the macOS entitlements ask for
      # something no embedded provisioning profile grants. That combination
      # produces a bundle which signs, notarizes and passes Gatekeeper but
      # cannot be launched at all (alpha.1 and alpha.2 both shipped that way).
      - name: Check macOS entitlements against the provisioning profile
        if: matrix.platform == 'macos-latest'
        run: bun scripts/check-macos-entitlements.mjs

      # The Safari web extension is built, and signed with the same Developer
      # ID identity, by scripts/build-safari-extension.sh, which Tauri runs as
      # beforeBundleCommand on macOS (tauri.macos.conf.json). It regenerates
      # the extension's Xcode project with xcodegen when project.yml changed,
      # and builds the extension/ fork's Safari flavour with bun.
      - name: Install xcodegen for the Safari extension
        if: matrix.platform == 'macos-latest'
        run: command -v xcodegen || brew install xcodegen

      # The command line tool (`rowel-cli`, src-tauri/crates/cli) ships beside
      # the app as a Tauri sidecar: Settings › General links it into the PATH,
      # and coding agents reach the vault through its MCP server. Tauri wants
      # a sidecar staged as `<name>-<target triple>` next to the config and
      # strips the triple when it copies it into the bundle. The bundler is
      # told about it only here, through tauri.release.conf.json merged with
      # `--config`, so a dev build (`bun run tauri:dev`) never has to build it
      # first. macOS builds one universal binary from both Apple targets, as
      # tauri-action does for the app itself.
      - name: Build the command line tool
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src-tauri/binaries
          case "${{ matrix.platform }}" in
            macos-latest)
              cargo build --release -p rowel-cli --manifest-path src-tauri/Cargo.toml --target aarch64-apple-darwin
              cargo build --release -p rowel-cli --manifest-path src-tauri/Cargo.toml --target x86_64-apple-darwin
              lipo -create \
                src-tauri/target/aarch64-apple-darwin/release/rowel-cli \
                src-tauri/target/x86_64-apple-darwin/release/rowel-cli \
                -output src-tauri/binaries/rowel-cli-universal-apple-darwin
              ;;
            ubuntu-latest)
              cargo build --release -p rowel-cli --manifest-path src-tauri/Cargo.toml
              cp src-tauri/target/release/rowel-cli src-tauri/binaries/rowel-cli-x86_64-unknown-linux-gnu
              ;;
            windows-latest)
              cargo build --release -p rowel-cli --manifest-path src-tauri/Cargo.toml
              cp src-tauri/target/release/rowel-cli.exe src-tauri/binaries/rowel-cli-x86_64-pc-windows-msvc.exe
              ;;
          esac
          ls -l src-tauri/binaries

      - name: Build, sign, notarize and upload to the draft release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater artifact signing (minisign keypair; pubkey in tauri.conf.json).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS code signing (Developer ID Application cert) + notarization.
          # The identity string is the certificate's name, not a secret; it is
          # the output of `security find-identity -v -p codesigning`.
          APPLE_CERTIFICATE: ${{ secrets.CERTIFICATES_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATES_P12_PASSWORD }}
          APPLE_SIGNING_IDENTITY: 'Developer ID Application: Oleksandr Chaplinsky (UFBL3F444A)'
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Google Drive sync OAuth client, read via option_env! at compile time.
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          # Dropbox sync app key (public, PKCE, no secret), read via option_env! at compile time.
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          # Public Drive API key for receiving shared secrets without a login.
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        with:
          tagName: v__VERSION__
          releaseName: Rowel v__VERSION__
          releaseBody: See the assets below to download and install this version.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          tauriScript: bun run tauri
          args: ${{ matrix.args }}

      # The check the previous two releases needed: actually start the signed
      # app. An entitlement the profile does not grant makes AMFI refuse the
      # spawn, and the process dies on SIGKILL before `main` — invisible to
      # codesign, notarization and spctl alike. Only launching it shows this.
      #
      # Deliberately narrow: a runner has no real window server, so the app is
      # allowed to exit for its own reasons. The single failure condition is
      # being killed outright.
      - name: Smoke-test that the signed app can launch
        if: matrix.platform == 'macos-latest'
        run: |
          APP="${{ matrix.bundlePath }}/macos/Rowel.app/Contents/MacOS/rowel"
          if [ ! -x "$APP" ]; then
            echo "::error::No built executable at $APP"
            exit 1
          fi
          "$APP" > /tmp/smoke.out 2> /tmp/smoke.err &
          PID=$!
          sleep 15
          if kill -0 "$PID" 2>/dev/null; then
            echo "Still running after 15s — the spawn was allowed."
            kill -9 "$PID" 2>/dev/null || true
            exit 0
          fi
          set +e; wait "$PID"; RC=$?; set -e
          if [ "$RC" -eq 137 ]; then
            echo "::error::SIGKILL on launch. macOS refused to spawn the signed app."
            echo "::error::Almost always an entitlement no embedded.provisionprofile grants."
            echo "--- stdout ---"; cat /tmp/smoke.out
            echo "--- stderr ---"; cat /tmp/smoke.err
            exit 1
          fi
          echo "Exited with $RC — started fine, then stopped for its own reasons."
          cat /tmp/smoke.err || true

      # The launch above says nothing about the Safari extension: Safari, not
      # the app, starts it. So check what Safari and Gatekeeper will: that it
      # is there, signed by the same team with hardened runtime and a
      # timestamp (notarization has already vouched for that much, but not
      # for the entitlements), sandboxed and in the App Group the app's socket
      # is in.
      - name: Check the bundled Safari extension
        if: matrix.platform == 'macos-latest'
        run: |
          APPEX="${{ matrix.bundlePath }}/macos/Rowel.app/Contents/PlugIns/Rowel Safari Extension.appex"
          if [ ! -d "$APPEX" ]; then
            echo "::error::No Safari extension at $APPEX"
            exit 1
          fi
          codesign --verify --strict --deep --verbose=2 "${{ matrix.bundlePath }}/macos/Rowel.app"
          INFO=$(codesign -dvv "$APPEX" 2>&1)
          echo "$INFO"
          echo "$INFO" | grep -q "TeamIdentifier=UFBL3F444A" || { echo "::error::extension not signed by team UFBL3F444A"; exit 1; }
          echo "$INFO" | grep -q "flags=.*runtime" || { echo "::error::extension without hardened runtime"; exit 1; }
          echo "$INFO" | grep -q "^Timestamp=" || { echo "::error::extension signature has no timestamp"; exit 1; }
          ENT=$(codesign -d --entitlements - --xml "$APPEX" 2>/dev/null)
          echo "$ENT" | grep -q "com.apple.security.app-sandbox" || { echo "::error::extension is not sandboxed"; exit 1; }
          echo "$ENT" | grep -q "UFBL3F444A.app.rowel.desktop" || { echo "::error::extension is not in the app group"; exit 1; }

      # --- The command line tool on its own ------------------------------
      # For a box without the app (docs/serve.md): the sidecar this job just
      # bundled, packed as `rowel`. macOS takes it out of the signed app, so
      # the archive holds the Developer ID-signed, hardened universal binary
      # the bundler signed, and submits the zip for notarization: a bare
      # binary cannot be stapled, so Gatekeeper looks its ticket up online.
      # Windows packs the exe the installer carries, unsigned like it. Linux's
      # are built in the `cli` job below, on an older Ubuntu.
      - name: Pack the command line tool
        if: matrix.platform != 'ubuntu-latest'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          mkdir -p extra-assets cli-stage
          case "${{ matrix.platform }}" in
            macos-latest)
              BIN="${{ matrix.bundlePath }}/macos/Rowel.app/Contents/MacOS/rowel-cli"
              codesign --verify --strict --verbose=2 "$BIN"
              INFO=$(codesign -dvv "$BIN" 2>&1)
              echo "$INFO" | grep -q "TeamIdentifier=UFBL3F444A" || { echo "::error::rowel-cli not signed by team UFBL3F444A"; exit 1; }
              echo "$INFO" | grep -q "flags=.*runtime" || { echo "::error::rowel-cli without hardened runtime"; exit 1; }
              cp "$BIN" cli-stage/rowel
              ARCHIVE="extra-assets/rowel-$VERSION-universal-apple-darwin.zip"
              ditto -c -k cli-stage "$ARCHIVE"
              RESULT=$(xcrun notarytool submit "$ARCHIVE" --apple-id "$APPLE_ID" \
                --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait --output-format json)
              echo "$RESULT"
              [ "$(echo "$RESULT" | jq -r .status)" = "Accepted" ] \
                || { echo "::error::Apple did not notarize the command line tool"; exit 1; }
              ;;
            windows-latest)
              cp src-tauri/target/release/rowel-cli.exe cli-stage/rowel.exe
              (cd cli-stage && 7z a -tzip "../extra-assets/rowel-$VERSION-x86_64-pc-windows-msvc.zip" rowel.exe)
              ;;
          esac
          ls -l extra-assets

      # --- Browser extension packages -------------------------------------
      # The Chromium and Firefox packages, built as CI's `extension` job
      # builds them and checked the same way, for testers to load and for the
      # store submissions (docs/releasing.md) to upload exactly what was
      # released. The Safari build the check also wants is thrown away.
      - name: Setup Node.js for the browser extension
        if: matrix.platform == 'ubuntu-latest'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Build the browser extension packages
        if: matrix.platform == 'ubuntu-latest'
        run: |
          set -euo pipefail
          (cd extension && npm ci && npm run build && npm run build:safari)
          node scripts/check-extension-build.mjs
          mkdir -p extra-assets
          cp extension/build/rowel_*_chromium.zip extension/build/rowel_*_firefox.zip extra-assets/
          ls -l extra-assets

      # Replace the placeholder release body with GitHub's auto-generated
      # release notes (the same "What's Changed" list the UI button produces),
      # built from PRs/commits since the previous release. Runs once, on Linux,
      # and only while the body is still the placeholder above: a re-run
      # against an existing draft leaves hand-edited notes alone.
      - name: Generate release notes
        if: matrix.platform == 'ubuntu-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLACEHOLDER: See the assets below to download and install this version.
        run: |
          TAG="v$(jq -r .version src-tauri/tauri.conf.json)"
          CURRENT=$(gh release view "$TAG" --json body --jq .body)
          if [ "$CURRENT" != "$PLACEHOLDER" ]; then
            echo "Release body already customised; leaving it untouched."
            exit 0
          fi
          NOTES=$(gh api "repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name="$TAG" --jq .body)
          if [ -n "$NOTES" ] && [ "$NOTES" != "null" ]; then
            gh release edit "$TAG" --notes "$NOTES"
          fi

      # --- Version-free "latest" copies -----------------------------------
      # Every name the bundler produces carries the version
      # (`Rowel_1.0.2_universal.dmg`), so no `releases/latest/download/<name>`
      # URL built from one can survive the next release. So each job copies its
      # own installers to the fixed names in `matrix.latestAssets` and uploads
      # those to the same release, byte-for-byte identical to (and signed and
      # notarized exactly like) the versioned asset they came from.
      #
      # Nothing else changes: the versioned installers, the updater bundles,
      # their `.sig` files and `latest.json` are still what tauri-action
      # uploaded, and the updater keeps reading the versioned URLs out of
      # `latest.json`. The copies are only there for humans, and — like every
      # other asset — they are reachable through `/releases/latest` only once
      # the draft is published.
      - name: Copy the installers to version-free names
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p latest-assets
          for pair in ${{ matrix.latestAssets }}; do
            pattern="${pair%%=*}"
            dest="${pair#*=}"
            # One bundler directory per format: bundle/dmg, bundle/nsis, …
            built=''
            for candidate in "${{ matrix.bundlePath }}"/*/$pattern; do
              [ -f "$candidate" ] || continue
              built="$candidate"
              break
            done
            if [ -z "$built" ]; then
              echo "::error::nothing under ${{ matrix.bundlePath }} matches $pattern, so $dest cannot be produced (did the bundler's naming change?)"
              exit 1
            fi
            cp "$built" "latest-assets/$dest"
            echo "$built -> latest-assets/$dest"
          done

      # --- SLSA build provenance (T-CI-4) ---------------------------------
      # Attest the installers this platform produced. Each pattern that matches
      # nothing is simply skipped; every platform matches at least its own
      # installers, so the attestation always has a subject.
      #
      # The version-free copies are attested under their own names in the same
      # call, which costs one extra subject each. Their bytes are unchanged, so
      # `gh attestation verify` (which looks an artifact up by digest) would
      # accept them either way.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ matrix.bundlePath }}/**/*.dmg
            ${{ matrix.bundlePath }}/**/*.app.tar.gz
            ${{ matrix.bundlePath }}/**/*.deb
            ${{ matrix.bundlePath }}/**/*.rpm
            ${{ matrix.bundlePath }}/**/*.AppImage
            ${{ matrix.bundlePath }}/**/*.msi
            ${{ matrix.bundlePath }}/**/*-setup.exe
            latest-assets/*
            extra-assets/*

      # Uploaded after the attestation so a copy is never downloadable without
      # its provenance. `--clobber` keeps a re-run against an existing draft
      # idempotent; the names are disjoint per platform, so the three jobs do
      # not race each other. The extra assets are the command line tool's
      # archive (macOS, Windows) and the extension packages (Linux).
      - name: Upload the version-free copies and extra assets to the release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          TAG="v$(jq -r .version src-tauri/tauri.conf.json)"
          gh release upload "$TAG" latest-assets/* extra-assets/* --clobber

      # --- CycloneDX SBOM (T-CI-4) ----------------------------------------
      # Generated once, on Linux, and attached to the release. The Rust SBOM is
      # authoritative (cargo-cyclonedx over the full Cargo.lock); the JS SBOM is
      # best-effort and never fails the release. Both tools are pinned to exact
      # versions: they run after the installers are uploaded and attested, with
      # this job's contents: write token in scope.
      - name: Install cargo-cyclonedx
        if: matrix.platform == 'ubuntu-latest'
        run: cargo install cargo-cyclonedx --version 0.5.9 --locked

      - name: Generate CycloneDX SBOMs
        if: matrix.platform == 'ubuntu-latest'
        run: |
          mkdir -p sbom
          cargo cyclonedx --manifest-path src-tauri/Cargo.toml --format json
          mv src-tauri/rowel.cdx.json sbom/rowel-rust.cdx.json
          npx --yes @cyclonedx/cdxgen@11.11.0 -t npm -o sbom/rowel-js.cdx.json . \
            || echo "JS SBOM generation skipped"

      - name: Attach SBOMs to the release
        if: matrix.platform == 'ubuntu-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(jq -r .version src-tauri/tauri.conf.json)"
          gh release upload "$TAG" sbom/* --clobber

  # The command line tool on its own for Linux, x86_64 and arm64, built here
  # rather than taken from the release job's sidecar: that one is built on
  # ubuntu-latest beside the app, whose WebKitGTK sets the floor anyway, while
  # a box without the app is as likely to run an older LTS. The tool needs no
  # system library but glibc (SQLCipher and OpenSSL are vendored, TLS is
  # rustls), and on Ubuntu 22.04, the oldest hosted runner, its floor is glibc
  # 2.35: Ubuntu 22.04 and later, Debian 13, Fedora 36 and later. It waits for
  # the release job because that job creates the draft it uploads to.
  cli:
    needs: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Build and pack the command line tool
        run: |
          set -euo pipefail
          VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          cargo build --release --locked -p rowel-cli --manifest-path src-tauri/Cargo.toml
          BIN=src-tauri/target/release/rowel-cli
          # The newest glibc symbol the binary asks for is its floor. A
          # runner image or a dependency that raises it fails here, not on a
          # user's box.
          FLOOR=$(objdump -T "$BIN" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "glibc floor: $FLOOR"
          [ "$(printf '%s\n' "$FLOOR" GLIBC_2.35 | sort -V | tail -1)" = GLIBC_2.35 ] \
            || { echo "::error::rowel-cli needs $FLOOR, above the documented glibc 2.35"; exit 1; }
          mkdir -p cli-stage extra-assets
          cp "$BIN" cli-stage/rowel
          tar -czf "extra-assets/rowel-$VERSION-${{ matrix.target }}.tar.gz" -C cli-stage rowel
          ls -l extra-assets

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: extra-assets/*

      - name: Upload to the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(jq -r .version src-tauri/tauri.conf.json)"
          gh release upload "$TAG" extra-assets/* --clobber

  # One SHA256SUMS over everything a user downloads to run without an
  # installer: the command line tool's archives and the extension packages.
  # Read back from the draft, so it sums exactly what was uploaded.
  checksums:
    needs: [release, cli]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Publish SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v$(jq -r .version src-tauri/tauri.conf.json)"
          mkdir sums
          gh release download "$TAG" --dir sums \
            --pattern 'rowel-*-linux-gnu.tar.gz' --pattern 'rowel-*-apple-darwin.zip' \
            --pattern 'rowel-*-windows-msvc.zip' --pattern 'rowel_*_chromium.zip' --pattern 'rowel_*_firefox.zip'
          (cd sums && sha256sum -- * > ../SHA256SUMS)
          cat SHA256SUMS
          [ "$(wc -l < SHA256SUMS)" -eq 6 ] \
            || { echo "::error::expected 4 command line archives and 2 extension packages"; exit 1; }
          gh release upload "$TAG" SHA256SUMS --clobber
