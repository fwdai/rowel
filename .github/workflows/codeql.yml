# CodeQL static analysis (SAST). JavaScript/TypeScript is the committed,
# blocking gate. Rust is included as a non-blocking leg (continue-on-error)
# because CodeQL's Rust support is still maturing — once it has proven green
# on this tree, drop the `continue-on-error` below to make it blocking too.
#
# Both legs use `build-mode: none`: CodeQL extracts from source without a full
# compile, so the Rust leg does not need the built frontend (`../dist`, which
# `generate_context!` otherwise requires) or the platform build dependencies.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly re-scan so advisories added to the CodeQL packs after merge surface.
    - cron: '27 3 * * 1'

# A superseded commit's analysis is worthless — cancel it. Push runs group per
# ref; PR runs per PR.
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The Rust leg costs ~8 minutes, so on PRs it only runs when Rust inputs
  # changed. Pushes to the protected branches and the weekly cron always run
  # everything, so Security-tab coverage never regresses.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            rust:
              - 'src-tauri/**'
              - '.github/codeql/**'
              - '.github/workflows/codeql.yml'

  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    needs: changes
    # `needs` never skips us: `always()` keeps this job alive on push/schedule,
    # where `changes` itself is skipped. On PRs the Rust leg runs only when
    # Rust inputs changed; a skipped leg satisfies branch protection.
    if: >-
      always() && (
        matrix.language != 'rust' ||
        github.event_name != 'pull_request' ||
        needs.changes.outputs.rust == 'true'
      )
    permissions:
      security-events: write
      actions: read
      contents: read
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            experimental: false
          # TODO: promote Rust to a blocking gate (experimental: false) once
          # CodeQL's Rust analysis has run green here a few times.
          - language: rust
            experimental: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: '/language:${{ matrix.language }}'
