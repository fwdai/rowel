<svg xmlns="http://www.w3.org/2000/svg" width="1748" height="544" viewBox="0 0 1748 544" role="img" aria-label="Rowel — Local-first Secrets Manager">
  <defs>
    <pattern id="dots" width="60" height="60" patternUnits="userSpaceOnUse">
